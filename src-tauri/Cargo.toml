[package]
name = "studioia-shell"
version = "1.0.0"
description = "StudioIA — enveloppe native (fenêtre, tray, backend enfant)"
authors = ["StudioIA"]
edition = "2021"

# Le shell ne lance aucun outil de build frontend (aucun beforeBuildCommand).
# La fenêtre charge le dashboard FastAPI (http://127.0.0.1:8080) une fois
# le backend Python prêt ; un index.html statique sert de splash de démarrage.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
